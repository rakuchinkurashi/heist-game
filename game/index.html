<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Frame Heist</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1420; }
  #game {
    position: fixed; inset: 0; margin: auto;
    width: min(100vw, 177.78vh);
    height: min(100vh, 56.25vw);
    display: block; touch-action: none; background: #1b2436;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="One Frame Heist: sneak through the vault room, lift 1000 dollars of loot, and escape before the alarm reaches 100 percent"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
